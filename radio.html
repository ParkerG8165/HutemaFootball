<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUTEMA Radio</title>
  <link rel="stylesheet" href="radio.css">
</head>
<body>
  <main class="site-shell">
    <iframe id="site-frame" title="HUTEMA website" src="index.html"></iframe>
  </main>

  <section class="radio-bar" aria-label="HUTEMA FIFA Radio">
    <div class="radio-brand">
      <div class="radio-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="brand-copy">
        <strong>HUTEMA <span>RADIO</span></strong>
        <small>FIFA SOUNDTRACKS</small>
        <p>Play music here without leaving HUTEMA.</p>
      </div>
    </div>
    <div class="youtube-player">
      <iframe
        title="FIFA 22 soundtrack compilation on YouTube"
        src="https://www.youtube-nocookie.com/embed/wLoXIt3O0GU?playsinline=1&rel=0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <script src="radio.js"></script>
</body>
</html>
