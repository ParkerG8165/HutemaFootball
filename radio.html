<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUTEMA Radio</title>
  <link rel="stylesheet" href="radio.css">
</head>
<body>
  <main class="site-shell">
    <iframe id="site-frame" title="HUTEMA website" src="index.html"></iframe>
  </main>

  <section class="radio-bar" aria-label="HUTEMA FIFA Radio">
    <div class="radio-brand">
      <div class="radio-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="brand-copy">
        <strong>HUTEMA <span>RADIO</span></strong>
        <small>ULTIMATE FIFA SOUNDTRACK</small>
      </div>
    </div>
    <div class="spotify-player">
      <iframe
        title="Ultimate FIFA Soundtrack on Spotify"
        src="https://open.spotify.com/embed/playlist/37i9dQZF1DWTMWIpgAlsRJ?utm_source=generator&theme=0"
        width="100%"
        height="132"
        frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
  </section>

  <script src="radio.js"></script>
</body>
</html>
