<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upper Customizer | Hutema</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="customizer-page" data-category="upper">
  <header class="site-header">
    <a class="logo" href="/" aria-label="Hutema home">
      <span class="logo-mark"></span>
      <span>HUTEMA</span>
    </a>

    <nav class="main-nav">
      <a href="main-line.html">Main Line</a>
      <a class="current" href="customizer.html">Customize</a>
      <a href="repurpose.html">Repurpose</a>
      <a href="about.html">About Us</a>
    </nav>
  </header>

  <main class="customizer-main">
    <nav class="config-tabs">
      <a class="active" href="customizer.html">Upper</a>
      <a href="soleplate.html">Soleplate</a>
    </nav>

    <section class="customizer-layout">
      <div class="options-panel">
        <div class="option-switcher">
          <button class="arrow-button previous" type="button">◀</button>
          <strong class="option-name">Leather</strong>
          <button class="arrow-button next" type="button">▶</button>
        </div>

        <p class="option-description">
          Choose the material that feels right for your game.
        </p>

        <div class="picture-grid"></div>
      </div>

      <section class="boot-preview">
        <div class="boot-illustration">
          <span class="boot-swoosh"></span>
        </div>
        <p>Your custom Hutema boot</p>
      </section>
    </section>
  </main>

  <script src="customizer.js"></script>
</body>
</html>
